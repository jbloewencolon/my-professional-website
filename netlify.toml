[build]
  # Pure static site — no build step. Babel transpiles the JSX in the browser.
  publish = "."
  command = "echo 'No build step.'"

# Make the file with the accented character reachable at a clean URL.
# Netlify URL-encodes the filename automatically, but a redirect spares
# anyone hand-typing the URL.
[[redirects]]
  from = "/"
  to = "/Jordan Loewen-Colón.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/Jordan Loewen-Colón.html"
  status = 200

# Long cache for static assets (images, CSS, JS).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.jsx"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/babel; charset=utf-8"
